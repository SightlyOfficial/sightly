<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;background:transparent;overflow:hidden}
svg{display:block;width:400px;height:400px}
.fx-blink{animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.fx-pulse{animation:fxpulse 1.2s ease-in-out infinite}
@keyframes fxpulse{50%{transform:scale(.8)}}
.fx-spin{animation:fxspin 2s linear infinite}
@keyframes fxspin{to{transform:rotate(360deg)}}
</style>
</head><body>
<svg id="x" viewBox="0 0 400 400"></svg>
<script src="../src/draw.js"></script>
<script>
  window.api.onConfig(c => drawCrosshair(document.getElementById('x'), c, 200, 200));
</script>
</body></html>
